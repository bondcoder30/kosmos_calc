<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Доставка — Kosmos</title>
<link rel="stylesheet" href="../style.css">
<style>
/* ============================================================
   Блок «Доставка». Универсальный — один файл на все торты.

   Принимает параметры через URL (?total=...&cake=...&tiered=0):
     total   — стоимость торта в рублях (целое число)
     cake    — название торта (для сообщения в телеграм)
     tiered  — 1 если торт ярусный (тогда самовывоз НЕЛЬЗЯ)

   Пример:
     delivery/?total=16395&cake=Колокольчик&tiered=0
   ============================================================ */
html,body{height:auto;min-height:100vh}
body{background:var(--bg);padding:0;margin:0}

.dlv-frame{
  max-width:520px;margin:0 auto;padding:28px 22px 36px;
  display:flex;flex-direction:column;gap:18px;align-items:stretch;
}

.dlv-title{
  margin:0 0 6px;
  font-family:var(--display);font-weight:900;
  font-size:30px;line-height:1;
  text-align:center;color:var(--pink);
  letter-spacing:-.5px;
  text-transform:lowercase;
}

.map-wrap{
  width:100%;
  aspect-ratio: 360 / 320;
  background:#dcdcdc;border-radius:8px;overflow:hidden;
}
.map-wrap iframe{display:block;width:100%;height:100%;border:0}

.zone-label{
  margin-top:8px;
  text-align:center;
  font-family:var(--display);font-weight:900;
  color:var(--pink);font-size:20px;text-transform:lowercase;
}

.zones{
  display:grid;
  grid-template-columns:repeat(3, 60px);
  gap:18px;justify-content:center;
  margin:0 auto;
}
.zone{
  width:60px;height:60px;border-radius:50%;
  border:0;outline:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:#fff;font-size:24px;
  position:relative;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  box-shadow:0 0 0 0 transparent;
}
.zone:hover{transform:scale(1.06)}
.zone.is-active{
  box-shadow:0 0 0 4px #fff, 0 0 0 6px currentColor;
}
.zone[disabled]{opacity:.35;cursor:not-allowed}
.zone[disabled]:hover{transform:none}

.z-orange{background:#E89A2E;color:#E89A2E}
.z-green {background:#3FA94E;color:#3FA94E}
.z-purple{background:#9558C9;color:#9558C9}
.z-brown {background:#A98968;color:#A98968}
.z-blue  {background:#3A9DD8;color:#3A9DD8}
.z-red   {background:#D2363C;color:#D2363C}

.dlv-cost{
  margin-top:10px;
  text-align:center;
}
.dlv-cost .lbl{
  font-family:var(--text);font-weight:400;
  color:var(--pink);font-size:13px;letter-spacing:.5px;
}
.dlv-cost .val{
  font-family:var(--display);font-weight:900;
  color:var(--pink);font-size:44px;line-height:1;
  margin-top:2px;
}

.dlv-total{text-align:center;margin-top:2px}
.dlv-total .lbl{
  font-family:var(--text);font-weight:400;
  color:var(--pink);font-size:13px;letter-spacing:.5px;
}
.dlv-total .val-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:4px;
}
.dlv-total .sparkle{
  width:22px;height:22px;color:var(--red);display:inline-block;flex-shrink:0;
}
.dlv-total .sparkle svg{width:100%;height:100%;fill:currentColor;display:block}
.dlv-total .val{
  font-family:var(--display);font-weight:900;
  color:var(--red);font-size:56px;line-height:1;letter-spacing:-1px;
  white-space:nowrap;
}

.dlv-cta{
  background:transparent;border:0;
  font-family:var(--display);font-weight:900;
  color:var(--pink);font-size:24px;line-height:1.15;
  text-transform:lowercase;text-align:center;
  padding:14px 8px 4px;
  letter-spacing:.2px;
  transition:opacity .15s ease;
}
.dlv-cta:hover{opacity:.78}
.dlv-cta[disabled]{opacity:.35;cursor:not-allowed}

.bow{
  width:90px;height:auto;margin:6px auto 0;display:block;color:var(--red);
}
.bow svg{display:block;width:100%;height:100%}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#0e0e0e;color:#fff;border-radius:8px;
  padding:10px 16px;font-family:var(--text);font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
  max-width:90vw;text-align:center;z-index:9999;
}
.toast.show{opacity:1}

@media (max-width:380px){
  .dlv-title{font-size:24px}
  .dlv-cost .val{font-size:36px}
  .dlv-total .val{font-size:44px}
  .zones{grid-template-columns:repeat(3,52px);gap:14px}
  .zone{width:52px;height:52px;font-size:20px}
}
</style>
</head>
<body>
<div class="dlv-frame">

  <h1 class="dlv-title">мы бережно<br>доставляем торты<br>по всей москве<br>и до 20 км от мкад.</h1>

  <div class="map-wrap">
    <iframe
      src="https://yandex.ru/map-widget/v1/?um=constructor%3Aee06b09908881d0ce064970f14ef714b8a4b7933a37782ec96d3e0c4c7e4b9ab&amp;source=constructor"
      title="Зоны доставки"
      loading="lazy"
      allowfullscreen></iframe>
  </div>

  <div class="zone-label">выберите зону</div>

  <div class="zones" id="zones">
    <button class="zone z-orange" data-key="orange" data-rate="1500" data-name="оранжевая зона" type="button"></button>
    <button class="zone z-green"  data-key="green"  data-rate="1000" data-name="зелёная зона"   type="button"></button>
    <button class="zone z-purple" data-key="purple" data-rate="0"    data-name="самовывоз"      data-pickup="1" type="button"></button>
    <button class="zone z-brown"  data-key="brown"  data-rate="3500" data-name="коричневая зона" type="button"></button>
    <button class="zone z-blue"   data-key="blue"   data-rate="2500" data-name="зона «к»"        type="button">к</button>
    <button class="zone z-red"    data-key="red"    data-rate="2000" data-name="красная зона"   type="button"></button>
  </div>

  <div class="dlv-cost">
    <div class="lbl">стоимость доставки</div>
    <div class="val" id="deliveryVal">—</div>
  </div>

  <div class="dlv-total">
    <div class="lbl">итоговая стоимость</div>
    <div class="val-row">
      <span class="sparkle"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 4 C52 38, 62 48, 96 50 C62 52, 52 62, 50 96 C48 62, 38 52, 4 50 C38 48, 48 38, 50 4 Z"/></svg></span>
      <div class="val" id="finalVal">—</div>
      <span class="sparkle"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 4 C52 38, 62 48, 96 50 C62 52, 52 62, 50 96 C48 62, 38 52, 4 50 C38 48, 48 38, 50 4 Z"/></svg></span>
    </div>
  </div>

  <button class="dlv-cta" id="contactBtn" type="button" disabled>
    продолжить заказ<br>с администратором
  </button>

  <div class="bow" aria-hidden="true">
    <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 30
               C 40 10, 12 10, 14 28
               C 16 44, 40 44, 50 30
               C 60 16, 84 16, 86 32
               C 88 50, 60 50, 50 30 Z"/>
      <path d="M50 30 L 46 58"/>
      <path d="M50 30 L 54 58"/>
    </svg>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Логика блока «доставка».
   Эта же функция используется в реальной интеграции на сайте:
   ?total=...&cake=...&tiered=...
   ============================================================ */
(function(){
  var TELEGRAM_URL = 'https://t.me/kosmoscake';

  function fmtRub(n){
    n = Math.round(+n || 0);
    return n.toLocaleString('ru-RU').replace(/\u00a0|\s/g,'\u00a0') + 'р';
  }

  function getParams(){
    var p = new URLSearchParams(location.search);
    return {
      total  : parseInt(p.get('total'),  10) || 0,
      cake   : (p.get('cake')   || '').trim(),
      weight : (p.get('weight') || '').trim(),  // кг
      tiers  : (p.get('tiers')  || '').trim(),  // ярусы (для ярусных)
      pieces : (p.get('pieces') || '').trim(),  // штук/порций (для фиксов)
      filling: (p.get('filling')|| '').trim(),  // начинка (опц.)
      tiered : p.get('tiered') === '1' || p.get('tiered') === 'true'
    };
  }

  var state = {
    params: getParams(),
    rate  : null,
    name  : null,
    pickup: false
  };

  var $zones      = document.getElementById('zones');
  var $deliveryV  = document.getElementById('deliveryVal');
  var $finalV     = document.getElementById('finalVal');
  var $contactBtn = document.getElementById('contactBtn');
  var $toast      = document.getElementById('toast');

  // Ярусные торты — самовывоза нет
  if (state.params.tiered){
    var purple = $zones.querySelector('[data-key="purple"]');
    if (purple){
      purple.setAttribute('disabled','disabled');
      purple.title = 'Самовывоз доступен только для не-ярусных тортов';
    }
  }

  function render(){
    if (state.rate === null){
      $deliveryV.textContent = '—';
      $finalV.textContent    = fmtRub(state.params.total);
      $contactBtn.setAttribute('disabled','disabled');
      return;
    }
    $deliveryV.textContent = state.pickup ? 'бесплатно' : fmtRub(state.rate);
    $finalV.textContent    = fmtRub(state.params.total + state.rate);
    $contactBtn.removeAttribute('disabled');
  }

  $zones.addEventListener('click', function(e){
    var btn = e.target.closest('.zone');
    if (!btn || btn.hasAttribute('disabled')) return;
    $zones.querySelectorAll('.zone').forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    state.rate   = parseInt(btn.dataset.rate, 10) || 0;
    state.name   = btn.dataset.name || '';
    state.pickup = btn.dataset.pickup === '1';
    render();
  });

  function toast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ $toast.classList.remove('show'); }, 3200);
  }

  function buildOrderText(){
    var p = state.params;
    var lines = [];
    lines.push('Здравствуйте! Хочу оформить заказ на торт.');
    if (p.cake)    lines.push('Торт: ' + p.cake);
    if (p.weight)  lines.push('Кг: ' + p.weight);
    if (p.tiers)   lines.push('Ярусов: ' + p.tiers);
    if (p.pieces)  lines.push('Порций: ' + p.pieces);
    if (p.filling) lines.push('Начинка: ' + p.filling);
    if (state.pickup){
      lines.push('Доставка: самовывоз (бесплатно)');
    } else {
      lines.push('Доставка: ' + state.name + ' — ' + fmtRub(state.rate));
    }
    lines.push('Итого: ' + fmtRub(p.total + (state.rate || 0)));
    return lines.join('\n');
  }

  $contactBtn.addEventListener('click', function(){
    if ($contactBtn.hasAttribute('disabled')) return;
    var text = buildOrderText();
    // Копируем в буфер и открываем телеграм
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        toast('Сообщение скопировано — вставьте его в чате');
      }).catch(function(){
        toast('Не удалось скопировать. Перешлите детали администратору');
      });
    } else {
      // fallback для старых браузеров
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Сообщение скопировано — вставьте его в чате'); }
      catch(e){ toast('Перешлите детали администратору'); }
      document.body.removeChild(ta);
    }
    setTimeout(function(){ window.open(TELEGRAM_URL, '_blank', 'noopener'); }, 400);
  });

  // postMessage из родительской страницы (когда блок открывают модалкой)
  window.addEventListener('message', function(e){
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type !== 'kosmos-cake') return;
    state.params.total   = parseInt(e.data.total, 10) || 0;
    state.params.cake    = (e.data.cake    || '').toString().trim();
    state.params.weight  = (e.data.weight  || '').toString().trim();
    state.params.tiers   = (e.data.tiers   || '').toString().trim();
    state.params.pieces  = (e.data.pieces  || '').toString().trim();
    state.params.filling = (e.data.filling || '').toString().trim();
    state.params.tiered  = !!e.data.tiered;
    if (state.params.tiered){
      var p = $zones.querySelector('[data-key="purple"]');
      if (p) p.setAttribute('disabled','disabled');
    } else {
      var p2 = $zones.querySelector('[data-key="purple"]');
      if (p2) p2.removeAttribute('disabled');
    }
    render();
  });

  render();
})();
</script>
</body>
</html>
