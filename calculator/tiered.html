<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Калькулятор — ярусные торты</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="calc-frame">
  <div class="calc-scroll" id="root"></div>
</div>

<script src="core.js"></script>
<script>
/* ================================================================
   ТИП 1 — ЯРУСНЫЕ
   total = ярусы × декор/ярус  +  вес_кг × 3200
   На каждый ярус — выбор начинки (для информации), 3200р/кг фикс.
   ================================================================ */

const {BASE, PLUS_CHEESECAKE, TYPE3_LOVE} = FILLING_SETS;

const CAKES = [
  { id:"bell",      name:"белль",                 decorPerTier:3000, minWeight:6,   minTiers:6,  fillings:BASE },
  { id:"lumiere",   name:"люмьер",                decorPerTier:3000, minWeight:10,  minTiers:10, fillings:PLUS_CHEESECAKE },
  { id:"fairy",     name:"fairy cake",            decorPerTier:3000, minWeight:4,   minTiers:2,  fillings:BASE },
  { id:"bigcherry", name:"big cherry fairy cake", decorPerTier:3000, minWeight:4,   minTiers:3,  fillings:BASE },
  { id:"chapito",   name:"шапито",                decorPerTier:3000, minWeight:6,   minTiers:2,  fillings:BASE },
  { id:"kuinji",    name:"куинджи",               decorPerTier:3000, minWeight:1.5, minTiers:1,  fillings:BASE, note:"Стоимость декора зависит от сложности — может быть выше." },
  { id:"darcy",     name:"дарси",                 decorPerTier:3000, minWeight:1.5, minTiers:1,  fillings:BASE },
  { id:"shine",     name:"shine bright",          decorPerTier:3500, minWeight:1.5, minTiers:1,  fillings:BASE },
  { id:"kelly",     name:"келли",                 decorPerTier:2000, minWeight:4,   minTiers:2,  fillings:TYPE3_LOVE },
  { id:"elizabeth", name:"элизабет",              decorPerTier:3000, minWeight:1.5, minTiers:1,  fillings:BASE },
];

const FILLING_RATE = 3200;

const state = { cakeIdx:0, weight:6, tiers:6, tierFillings:[] };

const root = document.getElementById('root');

function calc(){
  const c = CAKES[state.cakeIdx];
  const decor = state.tiers * c.decorPerTier;
  const filling = state.weight * FILLING_RATE;
  return { total: decor + filling, decor, filling };
}

function render(){
  const c = CAKES[state.cakeIdx];
  if (state.weight < c.minWeight) state.weight = c.minWeight;
  if (state.tiers  < c.minTiers)  state.tiers  = c.minTiers;
  while (state.tierFillings.length < state.tiers) state.tierFillings.push(c.fillings[0]);
  state.tierFillings = state.tierFillings.slice(0, state.tiers);

  const r = calc();
  root.innerHTML = `
    <div class="calc-meta">
      <span>Тип 1 · ярусные</span>
      <span>декор ${c.decorPerTier}р/ярус · начинка ${FILLING_RATE}р/кг</span>
    </div>
    <select class="cake-picker" id="cake">
      ${CAKES.map((x,i)=>`<option value="${i}" ${i===state.cakeIdx?'selected':''}>${x.name}</option>`).join('')}
    </select>

    <div class="label">Сколько килограмм?</div>
    <div class="stepper">
      <button class="step-btn minus" data-act="w-" aria-label="минус"><svg viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="30" rx="15"/></svg></button>
      <div class="value">${fmtWeight(state.weight)}</div>
      <button class="step-btn plus"  data-act="w+" aria-label="плюс"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="33" width="34" height="100" rx="14"/><rect y="33" width="100" height="34" rx="14"/></svg></button>
    </div>

    <div class="label">Сколько ярусов?</div>
    <div class="stepper">
      <button class="step-btn minus" data-act="t-" aria-label="минус"><svg viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="30" rx="15"/></svg></button>
      <div class="value">${state.tiers}</div>
      <button class="step-btn plus"  data-act="t+" aria-label="плюс"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="33" width="34" height="100" rx="14"/><rect y="33" width="100" height="34" rx="14"/></svg></button>
    </div>

    <div class="hint">От ${c.minTiers} ярус${c.minTiers===1?'а':'ов'}. От ${fmtWeight(c.minWeight)} кг.${c.note?'<br>'+c.note:''}</div>

    <div class="tiers">
      ${state.tierFillings.map((val,i)=>`
        <div class="tier-row">
          <div class="tier-label">начинка ${i+1} ярус</div>
          <select class="pill-select" data-tier="${i}">
            ${[...c.fillings, 'фальш ярус'].map(f=>`<option ${f===val?'selected':''}>${f}</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>

    <div class="total-wrap">
      <div class="total-label">итоговая стоимость</div>
      <div class="total-value">${fmtMoney(r.total)}</div>
    </div>
    <div class="send-row">
      <button id="send">Отправить заказ</button>
    </div>
  `;

  root.querySelector('#cake').onchange = (e)=>{
    state.cakeIdx = +e.target.value;
    state.tierFillings = [];
    const nc = CAKES[state.cakeIdx];
    state.weight = Math.max(state.weight, nc.minWeight);
    state.tiers  = Math.max(state.tiers,  nc.minTiers);
    render();
  };
  root.querySelectorAll('button[data-act]').forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if (a==='w+') state.weight = +(state.weight + 0.5).toFixed(1);
      if (a==='w-') state.weight = Math.max(c.minWeight, +(state.weight - 0.5).toFixed(1));
      if (a==='t+') state.tiers++;
      if (a==='t-') state.tiers = Math.max(c.minTiers, state.tiers - 1);
      render();
    };
  });
  root.querySelectorAll('select[data-tier]').forEach(s => {
    s.onchange = (e) => { state.tierFillings[+s.dataset.tier] = e.target.value; render(); };
  });
  root.querySelector('#send').onclick = () => {
    sendOrder({
      type:'tiered', cake:c.name, weight:state.weight, tiers:state.tiers,
      tierFillings: state.tierFillings.slice(0, state.tiers),
      decor:r.decor, filling:r.filling, total:r.total
    });
  };
}

render();
</script>
</body>
</html>
