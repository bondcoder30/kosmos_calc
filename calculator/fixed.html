<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Калькулятор — фикс. вес</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="calc-frame">
  <span class="sparkle tl"></span>
  <span class="sparkle tr"></span>
  <div class="calc-scroll" id="root"></div>
</div>

<script src="core.js"></script>
<script>
/* ================================================================
   ТИП 2 — ФИКС. ВЕС (яйцевидные)
   total = вес × цена_начинки  +  декор_для_веса
   Веса: 2.5 / 3.5, у каждого свой декор.
   ================================================================ */

const {BASE} = FILLING_SETS;

const CAKES = [
  { id:"faberge",   name:"фаберже",        decor:{2.5:3000, 3.5:3500}, fillings:BASE },
  { id:"secret",    name:"secret garden",  decor:{2.5:3500, 3.5:4000}, fillings:BASE },
  { id:"blueberry", name:"blueberry hill", decor:{2.5:5500, 3.5:6500}, fillings:BASE },
  { id:"lalaland",  name:"la la land",     decor:{2.5:3000, 3.5:3500}, fillings:BASE },
];

const state = { cakeIdx:0, weight:2.5, filling:null };

const root = document.getElementById('root');

function calc(){
  const c = CAKES[state.cakeIdx];
  const f = state.filling || c.fillings[0];
  const decor = c.decor[state.weight];
  const filling = state.weight * FILLING_PRICES[f];
  return { total: decor + filling, decor, filling };
}

function render(){
  const c = CAKES[state.cakeIdx];
  if (![2.5, 3.5].includes(state.weight)) state.weight = 2.5;
  if (!state.filling || !c.fillings.includes(state.filling)) state.filling = c.fillings[0];

  const r = calc();
  root.innerHTML = `
    <div class="calc-meta">
      <span>Тип 2 · фикс. вес</span>
      <span>декор ${c.decor[2.5]}р / ${c.decor[3.5]}р</span>
    </div>
    <select class="cake-picker" id="cake">
      ${CAKES.map((x,i)=>`<option value="${i}" ${i===state.cakeIdx?'selected':''}>${x.name}</option>`).join('')}
    </select>

    <div class="label">Сколько килограмм?</div>

    <div class="fixed-row" data-w="2.5">
      <button class="radio-big ${state.weight===2.5?'checked':''}" aria-label="2.5 кг" type="button"></button>
      <span class="value">2.5</span>
    </div>
    <div class="fixed-row" data-w="3.5">
      <button class="radio-big ${state.weight===3.5?'checked':''}" aria-label="3.5 кг" type="button"></button>
      <span class="value">3.5</span>
    </div>

    <div class="tier-row" style="margin-top:18px">
      <div class="tier-label">начинка</div>
      <select class="pill-select" id="filling">
        ${c.fillings.map(f=>`<option ${f===state.filling?'selected':''}>${f}</option>`).join('')}
      </select>
    </div>

    <div class="total-wrap">
      <span class="sparkle l"></span><span class="sparkle r"></span>
      <div class="total-label">итоговая стоимость</div>
      <div class="total-value">${fmtMoney(r.total)}</div>
    </div>
    <div class="send-row">
      <button id="send">Отправить заказ</button>
    </div>
  `;

  root.querySelector('#cake').onchange = (e) => {
    state.cakeIdx = +e.target.value; state.filling = null; render();
  };
  root.querySelectorAll('.fixed-row[data-w]').forEach(row => {
    row.onclick = () => { state.weight = parseFloat(row.dataset.w); render(); };
  });
  root.querySelector('#filling').onchange = (e) => { state.filling = e.target.value; render(); };
  root.querySelector('#send').onclick = () => {
    sendOrder({
      type:'fixed', cake:c.name, weight:state.weight, filling:state.filling,
      decor:r.decor, fillingCost:r.filling, total:r.total
    });
  };
}

render();
</script>
</body>
</html>
